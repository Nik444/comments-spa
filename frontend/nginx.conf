# Единственная точка входа для браузера: статика фронтенда, /api на Comments.Api, /hubs на Comments.Realtime.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Файл до 1 МБ плюс поля формы. Больше Api всё равно не примет.
    client_max_body_size 3m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; connect-src 'self' ws: wss:; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Swagger и GraphQL для проверяющих (Swagger включается настройкой Swagger__Enabled). Без CSP сайта: этим страницам нужны свои скрипты.
    location ~ ^/(swagger|openapi|graphql)(/|$) {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # SignalR по WebSocket: нужен переход протокола и долгое ожидание, иначе nginx закроет неактивное соединение.
    location /hubs/ {
        proxy_pass http://realtime:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # В именах файлов сборки есть хэш содержимого, поэтому их можно кэшировать надолго.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    location / {
        expires -1;
        try_files $uri /index.html;
    }
}
