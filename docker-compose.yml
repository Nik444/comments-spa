services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: comments-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Express"
      MSSQL_SA_PASSWORD: "Dev_Passw0rd_2026!"
    ports:
      - "1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql

  redis:
    image: redis:7-alpine
    container_name: comments-redis
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:4-management
    container_name: comments-rabbit
    environment:
      RABBITMQ_DEFAULT_USER: comments
      RABBITMQ_DEFAULT_PASS: comments_dev
    ports:
      - "5672:5672"     # AMQP, по нему подключается приложение
      - "15672:15672"   # веб-интерфейс управления
    volumes:
      - rabbit-data:/var/lib/rabbitmq

volumes:
  mssql-data:
  rabbit-data: